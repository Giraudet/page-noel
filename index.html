<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joyeux Noël – CSE</title>
<style>
:root{--bg1:#0f3d2e;--bg2:#06201a;--text:#fff8ec;--red:#d62839;--gold:#ffd166;--skin:#f2c9a5;--card:rgba(255,255,255,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--bg1),var(--bg2));color:var(--text);font-family:Georgia,"Times New Roman",serif;text-align:center;overflow-x:hidden}
main{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(1.8rem,7vw,3rem);margin:0 0 6px;color:var(--gold)}
p.sub{margin:0 0 28px;opacity:.9}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 22px}
.elf{position:relative;width:130px;cursor:pointer;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d,0s);-webkit-tap-highlight-color:transparent}
.elf.jump{animation:jump .7s ease}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes jump{40%{transform:translateY(-34px) rotate(-6deg)}}
.hat{position:absolute;top:-38px;left:50%;width:104px;margin-left:-52px;z-index:3;transform-origin:50% 100%;animation:wag 1.6s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(5deg)}}
.photo{position:relative;width:104px;height:104px;margin:0 auto;border-radius:50%;border:4px solid var(--gold);background:#2a5c4a;overflow:visible}
.photo img,.photo .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:2.4rem;background:#3b7a63}
.photo::before,.photo::after{content:"";position:absolute;top:34px;width:26px;height:30px;background:var(--skin);border:2px solid #d9a982;z-index:-1}
.photo::before{left:-20px;clip-path:polygon(100% 20%,0 0,100% 85%)}
.photo::after{right:-20px;clip-path:polygon(0 20%,100% 0,0 85%)}
.name{margin-top:8px;font-size:.95rem;color:var(--gold)}
.role{font-size:.75rem;opacity:.8}
.bubble{position:absolute;bottom:calc(100% + 30px);left:50%;transform:translateX(-50%) scale(.3);opacity:0;background:#fff;color:#b3202e;font-weight:bold;font-size:.9rem;padding:7px 12px;border-radius:14px;white-space:nowrap;transition:.35s cubic-bezier(.3,1.6,.5,1);z-index:5}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
.elf.talk .bubble{opacity:1;transform:translateX(-50%) scale(1)}
.actions{margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:14px}
.btn{display:inline-block;padding:15px 28px;border-radius:40px;background:var(--red);color:#fff;font:bold 1.1rem Georgia,serif;text-decoration:none;border:0;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer}
.btn.alt{background:var(--card);border:1px solid var(--gold);color:var(--gold);font-size:.95rem;padding:10px 20px;box-shadow:none}
.snow{position:fixed;top:-10px;z-index:1;color:#fff;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) translateX(30px)}}
@media (prefers-reduced-motion:reduce){.elf,.hat,.snow{animation:none}}
</style>
</head>
<body>
<main>
  <h1>🎄 Joyeux Noël ! 🎄</h1>
  <p class="sub">Toute l’équipe du CSE vous souhaite de belles fêtes !<br>Touchez un lutin pour le faire sauter.</p>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <a class="btn" id="ticket" href="#" target="_blank" rel="noopener">🎟️ Ouvrir l’application Yeati</a>
    
  </div>
</main>
<script>
// À MODIFIER : adresse de la billetterie du CSE
var BILLETTERIE_URL = "https://mon-yeati.co/connexion";
document.getElementById("ticket").href = BILLETTERIE_URL;

var HAT = '<svg class="hat" viewBox="0 0 100 70"><path d="M10 58C12 30 40 6 80 14C68 26 80 44 92 58Z" fill="#d62839"/><rect x="4" y="54" width="94" height="14" rx="7" fill="#fff"/><circle cx="82" cy="13" r="8" fill="#fff"/></svg>';
var MSGS = ["Joyeux Noël !", "Ho ho ho !", "Joyeux Noël à tous !"];
var grid = document.getElementById("grid");
var n = 0;

function addElf(name, src, emoji, role){
  var d = document.createElement("div");
  d.className = "elf";
  d.style.setProperty("--d", (n * 0.3) + "s");
  var inner = src ? '<img alt="">' : '<div class="ph">' + emoji + '</div>';
  d.innerHTML = '<div class="bubble">' + MSGS[0] + '</div>' + HAT + '<div class="photo">' + inner + '</div><div class="name"></div><div class="role"></div>';
  if (src) d.querySelector("img").src = src;
  d.querySelector(".name").textContent = name;
  d.querySelector(".role").textContent = role || "";
  d.addEventListener("click", function(){
    d.classList.remove("jump"); void d.offsetWidth; d.classList.add("jump");
    say(d);
  });
  grid.appendChild(d);
  n++;
}
function say(d){
  d.querySelector(".bubble").textContent = MSGS[Math.floor(Math.random() * MSGS.length)];
  d.classList.add("talk");
  setTimeout(function(){ d.classList.remove("talk"); }, 2200);
}
